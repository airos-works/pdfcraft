[package]
name = "pdfcraft-haiku"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PdfCraft for air/OS and Haiku: the egui front end in a native BWindow"

# Not the workspace's lints: the native host is reached through `unsafe` FFI, confined to
# `src/host.rs` (`#[allow(unsafe_code)]` there). Everything else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# clippy.toml bans `Instant::now`, which traps on wasm; this crate is Haiku only (its event loop
# times frames and repaints).
disallowed_methods = "allow"

[[bin]]
name = "PdfCraft"
path = "src/main.rs"

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-platform = { workspace = true }
pdfcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
# The log's timestamps (`../pdfcraft/src/logging.rs`, shared with the desktop app).
chrono = { workspace = true }
log = { workspace = true }
rayon = "1"
# Pictures copied to the clipboard as PNG (egui's CopyImage).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "haiku")'.dependencies]
# The GPU renderer (src/gpu.rs, src/present.rs): egui drawn with Vulkan, as PhotoCraft's host does.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan"] }
egui-wgpu = { version = "0.37", default-features = false }
# The raw Vulkan device, to import the screen's frame buffer (src/scanout.rs); the version wgpu-hal uses.
ash = "0.38"
pollster = "1"

[build-dependencies]
cc = "1"
